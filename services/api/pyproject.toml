[project]
name = "mis-dos-marias-api"
version = "0.1.0"
description = "Backend API para MIS DOS MARÍAS E.I.R.L. — Sistema de Gestión Documental Empresarial"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.35.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.3",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.6.1",
    "python-multipart>=0.0.17",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
