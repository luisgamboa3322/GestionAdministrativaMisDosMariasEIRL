services:
  postgres:
    image: postgres:16-alpine
    container_name: mdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transportdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave_local}
      POSTGRES_DB: ${POSTGRES_DB:-mis_dos_marias}
      TZ: America/Lima
    ports:
      - "5433:5432"
    volumes:
      - mdm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transportdocs} -d ${POSTGRES_DB:-mis_dos_marias}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mdm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cambia_esta_clave_minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mdm_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mdm_postgres_data:
  mdm_minio_data:
